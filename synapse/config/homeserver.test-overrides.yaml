# Relaxed rate limits for E2E testing
rc_registration:
  per_second: 500
  burst_count: 1000

rc_login:
  address:
    per_second: 500
    burst_count: 1000
  account:
    per_second: 500
    burst_count: 1000
  failed_attempts:
    per_second: 500
    burst_count: 1000

rc_message:
  per_second: 1000
  burst_count: 10000

# Specific rate limit for the /createRoom endpoint. 
# Note: Synapse does not support a `per_user` sub-block for this specific key!
rc_room_creation:
  per_second: 500
  burst_count: 1000

# Creating a room forces the creator to join it, which hits the join limit.
# You need to relax both local and remote to prevent the server from choking 
# and leaving you with ghost rooms.
rc_joins:
  local:
    per_second: 500
    burst_count: 1000
  remote:
    per_second: 500
    burst_count: 1000

# Spaces rely heavily on invites to link the hierarchy together. 
# You'll hit invite limits almost immediately without these overrides.
rc_invites:
  per_room:
    per_second: 500
    burst_count: 1000
  per_user:
    per_second: 500
    burst_count: 1000
  per_issuer:
    per_second: 500
    burst_count: 1000